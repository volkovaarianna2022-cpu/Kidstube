# Детский YouTube — сборка APK одним файлом.
# Положите этот файл в репозиторий GitHub по пути .github/workflows/build.yml
name: Build KidsTube APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/kg/kidstube app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > settings.gradle <<'KT_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KidsTube"
          include ':app'
          KT_EOF
          cat > build.gradle <<'KT_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          KT_EOF
          cat > gradle.properties <<'KT_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          KT_EOF
          cat > app/build.gradle <<'KT_EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'kg.kidstube'
              compileSdk 35

              defaultConfig {
                  applicationId 'kg.kidstube'
                  minSdk 26
                  targetSdk 35
                  versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
                  versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }

              signingConfigs {
                  family {
                      storeFile file('kidstube.jks')
                      storePassword 'kidstube123'
                      keyAlias 'kidstube'
                      keyPassword 'kidstube123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.family
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          KT_EOF
          cat > app/src/main/AndroidManifest.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KT_EOF
          cat > app/src/main/res/values/strings.xml <<'KT_EOF'
          <resources><string name="app_name">Детский YouTube</string></resources>
          KT_EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          KT_EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFB238" />
          </shape>
          KT_EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M34,38 Q34,32 40,32 L68,32 Q74,32 74,38 L74,70 Q74,76 68,76 L40,76 Q34,76 34,70 Z" />
              <path android:fillColor="#E8572A" android:pathData="M48,44 L64,54 L48,64 Z" />
          </vector>
          KT_EOF
          cat > app/src/main/java/kg/kidstube/MainActivity.java <<'KT_EOF'
          package kg.kidstube;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              // Страница грузится "с этого адреса", чтобы плееру YouTube был виден нормальный referrer
              // (без него встроенный плеер выдаёт ошибку 153).
              private static final String BASE_URL = "https://kidstube.app/";

              private WebView web;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;
              private final Handler ui = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#FFF6E8"));
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  // Убираем метку встроенного браузера ("; wv"), иначе YouTube иногда не пускает плеер.
                  String ua = s.getUserAgentString().replace("; wv)", ")").replaceAll("Version/[\\d.]+ ", "");
                  s.setUserAgentString(ua);

                  web.addJavascriptInterface(new Bridge(), "Android");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          // Никаких переходов главной страницы: ребёнок не уйдёт на youtube.com,
                          // даже если нажмёт логотип или название в плеере.
                          return req.isForMainFrame();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) { callback.onCustomViewHidden(); return; }
                          customView = view;
                          customCallback = callback;
                          root.addView(view, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          web.setVisibility(View.GONE);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          getWindow().getDecorView().setSystemUiVisibility(
                                  View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                      }

                      @Override
                      public void onHideCustomView() {
                          exitFullscreen();
                      }
                  });

                  String html = readAsset("index.html");
                  web.loadDataWithBaseURL(BASE_URL, html, "text/html", "utf-8", null);
              }

              private void exitFullscreen() {
                  if (customView == null) return;
                  root.removeView(customView);
                  customView = null;
                  web.setVisibility(View.VISIBLE);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  if (customCallback != null) customCallback.onCustomViewHidden();
                  customCallback = null;
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (customView != null) { exitFullscreen(); return; }
                  web.evaluateJavascript("window.handleBack ? handleBack() : false", value -> {
                      if (!"true".equals(value)) MainActivity.super.onBackPressed();
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.evaluateJavascript("window.pauseVideo && pauseVideo()", null);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }

              private String readAsset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      return new String(readAll(in), StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "<h1>Ошибка загрузки</h1>";
                  }
              }

              private static byte[] readAll(InputStream in) throws Exception {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] buf = new byte[16384];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  return out.toByteArray();
              }

              /** Мост для JS: скачивает страницы YouTube (RSS, oEmbed) в обход CORS. Только youtube.com. */
              private class Bridge {
                  @JavascriptInterface
                  public void fetch(final String id, final String url) {
                      new Thread(() -> {
                          boolean ok = false;
                          String body;
                          try {
                              String host = Uri.parse(url).getHost();
                              if (host == null || !(host.equals("youtube.com") || host.endsWith(".youtube.com"))) {
                                  throw new Exception("host not allowed");
                              }
                              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                              c.setConnectTimeout(15000);
                              c.setReadTimeout(20000);
                              c.setRequestProperty("User-Agent",
                                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36");
                              c.setRequestProperty("Accept-Language", "ru,en;q=0.8");
                              c.setRequestProperty("Cookie", "CONSENT=YES+1; SOCS=CAI");
                              int code = c.getResponseCode();
                              InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                              body = in == null ? "" : new String(readAll(in), StandardCharsets.UTF_8);
                              ok = code < 400;
                          } catch (Exception e) {
                              body = String.valueOf(e.getMessage());
                          }
                          final String js = "window.__fetchDone(" + JSONObject.quote(id) + "," + ok + ","
                                  + JSONObject.quote(body) + ")";
                          ui.post(() -> web.evaluateJavascript(js, null));
                      }).start();
                  }
              }
          }
          KT_EOF
          cat > app/src/main/assets/index.html <<'KT_EOF'
          <!doctype html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
          <title>Детский YouTube</title>
          <style>
            :root {
              --bg: #FFF6E8;
              --card: #FFFFFF;
              --ink: #2B1D14;
              --muted: #8A7563;
              --accent: #E8572A;
              --accent-soft: #FFE1CF;
              --line: #F0E2D0;
              --radius: 20px;
            }
            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
              font-family: system-ui, -apple-system, "Roboto", sans-serif; user-select: none; }
            button { font: inherit; border: 0; cursor: pointer; }
            .view { display: none; min-height: 100%; padding: 16px 16px 40px; }
            .view.on { display: block; }

            header { display: flex; align-items: center; gap: 10px; margin: 4px 0 18px; }
            header h1 { flex: 1; margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--card);
              color: var(--ink); font-size: 22px; display: grid; place-items: center;
              box-shadow: 0 1px 0 var(--line); flex: none; }
            .gear { background: transparent; color: #CDBBA8; box-shadow: none; font-size: 20px; }

            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
            .card { background: var(--card); border-radius: var(--radius); overflow: hidden; text-align: left;
              padding: 0; color: var(--ink); box-shadow: 0 2px 0 var(--line); transition: transform .12s; }
            .card:active { transform: scale(0.96); }
            .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--accent-soft); }
            .card .t { padding: 10px 12px 12px; font-size: 15px; font-weight: 600; line-height: 1.25;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
            .card .kind { padding: 0 12px 12px; margin-top: -6px; font-size: 12px; color: var(--muted); }

            .big-btn { display: block; width: 100%; padding: 16px; border-radius: 18px; background: var(--accent);
              color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
            .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 17px; line-height: 1.5; }
            .empty b { display: block; font-size: 54px; margin-bottom: 10px; }
            .status { text-align: center; color: var(--muted); padding: 30px 0; }

            /* Плеер */
            #player-view { position: fixed; inset: 0; padding: 0; background: #111; color: #fff;
              display: none; flex-direction: column; z-index: 10; }
            #player-view.on { display: flex; }
            #player-view .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
            #player-view .bar .icon-btn { background: #2A2A2A; color: #fff; box-shadow: none; }
            #player-view .bar .title { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
            .player-box { width: 100%; aspect-ratio: 16/9; background: #000; flex: none; position: relative; }
            .player-box iframe, #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
            .msg { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
              padding: 20px; font-size: 16px; background: #000; color: #ddd; }
            .msg.on { display: grid; }
            .up-next { flex: 1; overflow-y: auto; padding: 12px 12px 30px; }
            .up-next h3 { margin: 4px 4px 10px; font-size: 14px; color: #999; font-weight: 600; }
            .row { display: flex; gap: 12px; align-items: center; width: 100%; padding: 6px; border-radius: 14px;
              background: transparent; color: #eee; text-align: left; }
            .row.cur { background: #2A2A2A; }
            .row img { width: 128px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; flex: none; background: #333; }
            .row span { font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3;
              -webkit-box-orient: vertical; overflow: hidden; }

            /* Родительский раздел */
            .panel { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
            .panel p { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.45; }
            input[type=text], input[type=number] { width: 100%; padding: 14px; font-size: 16px; border-radius: 14px;
              border: 2px solid var(--line); background: var(--bg); color: var(--ink); outline: none; }
            input:focus { border-color: var(--accent); }
            .add-row { display: flex; gap: 8px; }
            .add-row button { padding: 0 18px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; }
            .src { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
            .src:first-child { border-top: 0; }
            .src img { width: 72px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--accent-soft); }
            .src .n { flex: 1; font-size: 15px; font-weight: 600; }
            .src .n small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
            .src button { background: var(--accent-soft); color: var(--accent); width: 36px; height: 36px; border-radius: 10px; font-size: 16px; }
            .note { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
            .note.err { color: #C0392B; }

            .gate { max-width: 360px; margin: 40px auto 0; text-align: center; }
            .gate .q { font-size: 34px; font-weight: 800; margin: 18px 0; }
            .gate input { text-align: center; font-size: 24px; }
          </style>
          </head>
          <body>

          <!-- Главная -->
          <section id="home" class="view on">
            <header>
              <h1>Что посмотрим?</h1>
              <button class="icon-btn gear" onclick="openGate()" aria-label="Для родителей">⚙</button>
            </header>
            <div id="home-grid" class="grid"></div>
          </section>

          <!-- Канал / плейлист -->
          <section id="source" class="view">
            <header>
              <button class="icon-btn" onclick="go('home')" aria-label="Назад">←</button>
              <h1 id="source-title"></h1>
              <button class="icon-btn" onclick="loadSource(curSource, true)" aria-label="Обновить">⟳</button>
            </header>
            <button id="play-all" class="big-btn" onclick="playAll()">▶ Смотреть всё подряд</button>
            <div id="source-grid" class="grid"></div>
          </section>

          <!-- Плеер -->
          <section id="player-view" class="view">
            <div class="bar">
              <button class="icon-btn" onclick="closePlayer()" aria-label="Назад">←</button>
              <div class="title" id="player-title"></div>
            </div>
            <div class="player-box"><div id="yt"></div><div class="msg" id="player-msg"></div></div>
            <div class="up-next"><h3 id="next-h">Дальше</h3><div id="next-list"></div></div>
          </section>

          <!-- Проверка взрослого -->
          <section id="gate" class="view">
            <header>
              <button class="icon-btn" onclick="go('home')" aria-label="Назад">←</button>
              <h1>Для взрослых</h1>
            </header>
            <div class="gate">
              <div style="color:var(--muted)">Решите пример, чтобы продолжить</div>
              <div class="q" id="gate-q"></div>
              <input type="number" id="gate-a" inputmode="numeric" placeholder="Ответ">
              <button class="big-btn" style="margin-top:14px" onclick="checkGate()">Дальше</button>
              <div class="note err" id="gate-err"></div>
            </div>
          </section>

          <!-- Настройки -->
          <section id="settings" class="view">
            <header>
              <button class="icon-btn" onclick="go('home')" aria-label="Назад">←</button>
              <h1>Что можно смотреть</h1>
            </header>
            <div class="panel">
              <p>Вставьте ссылку на канал, плейлист или отдельное видео из YouTube. Ребёнок увидит только то, что есть в этом списке.</p>
              <div class="add-row">
                <input type="text" id="add-url" placeholder="https://youtube.com/@канал">
                <button onclick="addSource()">+</button>
              </div>
              <div class="note" id="add-note"></div>
            </div>
            <div class="panel" id="src-list"></div>
            <div class="panel">
              <p>Совет: у каналов в списке видны последние 15 видео. Чтобы дать доступ к старым выпускам, сделайте у себя на YouTube плейлист и добавьте его сюда — или пусть ребёнок жмёт «Смотреть всё подряд».</p>
            </div>
          </section>

          <script>
          /* ---------- Хранилище ---------- */
          const store = {
            get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
            set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
          };
          let sources = store.get('kt_sources', []);
          const saveSources = () => store.set('kt_sources', sources);

          /* ---------- Загрузка через Android-мост (без CORS) ---------- */
          let fetchSeq = 0;
          const pending = {};
          window.__fetchDone = (id, ok, body) => {
            const p = pending[id]; if (!p) return;
            delete pending[id];
            ok ? p.res(body) : p.rej(new Error(body || 'Ошибка сети'));
          };
          function ytFetch(url) {
            if (!window.Android) return fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
            return new Promise((res, rej) => {
              const id = 'f' + (++fetchSeq);
              pending[id] = { res, rej };
              Android.fetch(id, url);
            });
          }

          /* ---------- Утилиты ---------- */
          const $ = id => document.getElementById(id);
          const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
          const thumbOf = vid => 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg';
          const kindName = { channel: 'Канал', playlist: 'Плейлист', video: 'Видео' };

          let curView = 'home';
          function go(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === name));
            curView = name;
            window.scrollTo(0, 0);
            if (name === 'home') renderHome();
            if (name === 'settings') renderSettings();
          }

          /* Кнопка «Назад» Android: true — обработали сами, false — свернуть приложение */
          window.handleBack = function () {
            if (curView === 'player-view') { closePlayer(); return true; }
            if (curView !== 'home') { go('home'); return true; }
            return false;
          };

          /* ---------- Главная ---------- */
          function renderHome() {
            const g = $('home-grid');
            if (!sources.length) {
              g.outerHTML = '<div id="home-grid" class="empty"><b>📺</b>Здесь пока пусто.<br>Попроси взрослого добавить мультики.</div>';
              return;
            }
            if (g.className !== 'grid') { g.className = 'grid'; }
            g.innerHTML = sources.map((s, i) =>
              `<button class="card" onclick="openSource(${i})">
                 <img class="thumb" src="${esc(s.thumb)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                 <div class="t">${esc(s.title)}</div>
               </button>`).join('');
          }

          /* ---------- Канал / плейлист ---------- */
          let curSource = null;
          let curVideos = [];

          function feedUrl(s) {
            return s.type === 'channel'
              ? 'https://www.youtube.com/feeds/videos.xml?channel_id=' + s.ytId
              : 'https://www.youtube.com/feeds/videos.xml?playlist_id=' + s.ytId;
          }

          function parseFeed(xml) {
            const doc = new DOMParser().parseFromString(xml, 'application/xml');
            if (doc.getElementsByTagName('parsererror').length) throw new Error('Не удалось прочитать список видео');
            const feedTitle = (doc.querySelector('feed > title') || {}).textContent || '';
            const author = (doc.querySelector('feed > author > name') || {}).textContent || '';
            const videos = Array.from(doc.getElementsByTagName('entry')).map(e => {
              const id = (e.getElementsByTagName('yt:videoId')[0] || {}).textContent;
              const title = (e.getElementsByTagName('title')[0] || {}).textContent;
              return id ? { id, title, thumb: thumbOf(id) } : null;
            }).filter(Boolean);
            return { title: feedTitle || author, videos };
          }

          function openSource(i) {
            const s = sources[i];
            if (s.type === 'video') {
              curSource = s;
              curVideos = [{ id: s.ytId, title: s.title, thumb: s.thumb }];
              playVideo(0);
              return;
            }
            curSource = s;
            $('source-title').textContent = s.title;
            go('source');
            loadSource(s, false);
          }

          async function loadSource(s, force) {
            const g = $('source-grid');
            const cache = store.get('kt_cache_' + s.ytId, null);
            if (cache) { curVideos = cache.videos; renderSource(); }
            else g.innerHTML = '<div class="status" style="grid-column:1/-1">Загружаю…</div>';
            if (cache && !force && Date.now() - cache.ts < 3600e3) return;
            try {
              const { videos } = parseFeed(await ytFetch(feedUrl(s)));
              store.set('kt_cache_' + s.ytId, { ts: Date.now(), videos });
              if (curSource === s) { curVideos = videos; renderSource(); }
            } catch (e) {
              if (!cache) g.innerHTML = '<div class="status" style="grid-column:1/-1">Не получилось загрузить. Проверь интернет и нажми ⟳</div>';
            }
          }

          function renderSource() {
            const g = $('source-grid');
            if (!curVideos.length) { g.innerHTML = '<div class="status" style="grid-column:1/-1">Тут пока нет видео</div>'; return; }
            g.innerHTML = curVideos.map((v, i) =>
              `<button class="card" onclick="playVideo(${i})">
                 <img class="thumb" src="${esc(v.thumb)}" alt="" loading="lazy">
                 <div class="t">${esc(v.title)}</div>
               </button>`).join('');
          }

          /* ---------- Плеер (YouTube IFrame API) ---------- */
          let yt = null, ytReady = null, curIndex = 0, playlistMode = false;
          const HOSTS = ['https://www.youtube.com', 'https://www.youtube-nocookie.com'];
          let hostIdx = 0, lastOpts = null, retried = false;

          function loadYtApi() {
            if (ytReady) return ytReady;
            ytReady = new Promise(res => {
              window.onYouTubeIframeAPIReady = res;
              const sc = document.createElement('script');
              sc.src = 'https://www.youtube.com/iframe_api';
              document.head.appendChild(sc);
            });
            return ytReady;
          }

          const baseVars = { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, fs: 1, hl: 'ru', cc_load_policy: 0 };

          function showMsg(text) { const m = $('player-msg'); m.textContent = text || ''; m.classList.toggle('on', !!text); }

          async function createPlayer(opts, isRetry) {
            lastOpts = opts;
            if (!isRetry) { retried = false; }
            showMsg('');
            $('player-title').textContent = opts.title || '';
            document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'player-view'));
            curView = 'player-view';
            await loadYtApi();
            if (yt) { try { yt.destroy(); } catch (e) {} yt = null; }
            if (!$('yt')) { const d = document.createElement('div'); d.id = 'yt'; document.querySelector('.player-box').prepend(d); }
            yt = new YT.Player('yt', {
              host: HOSTS[hostIdx],
              videoId: opts.videoId,
              playerVars: Object.assign({}, baseVars, opts.vars || {}),
              events: { onStateChange: onState, onError: onErr }
            });
          }

          function playVideo(i) {
            playlistMode = false;
            curIndex = i;
            const v = curVideos[i];
            createPlayer({ videoId: v.id, title: v.title });
            renderNext();
          }

          function playAll() {
            const s = curSource;
            // У каналов есть скрытый плейлист «все загрузки»: UC… → UU…
            const list = s.type === 'channel' ? 'UU' + s.ytId.slice(2) : s.ytId;
            playlistMode = true;
            createPlayer({ title: s.title, vars: { listType: 'playlist', list } });
            $('next-h').textContent = 'Видео идут подряд, следующее включится само';
            $('next-list').innerHTML = '';
          }

          function renderNext() {
            $('next-h').textContent = curVideos.length > 1 ? 'Дальше' : '';
            $('next-list').innerHTML = curVideos.length > 1 ? curVideos.map((v, i) =>
              `<button class="row ${i === curIndex ? 'cur' : ''}" onclick="playVideo(${i})">
                 <img src="${esc(v.thumb)}" alt="" loading="lazy"><span>${esc(v.title)}</span>
               </button>`).join('') : '';
          }

          function onState(e) {
            if (playlistMode) {
              try { const d = yt.getVideoData(); if (d && d.title) $('player-title').textContent = d.title; } catch (x) {}
              return;
            }
            // Видео закончилось — включаем следующее из разрешённого списка
            if (e.data === YT.PlayerState.ENDED && curIndex + 1 < curVideos.length) playVideo(curIndex + 1);
          }

          function onErr(e) {
            const c = e.data;
            // Первая ошибка — пробуем другой адрес плеера (youtube.com ↔ youtube-nocookie.com)
            if (!retried && lastOpts) {
              retried = true;
              hostIdx = 1 - hostIdx;
              createPlayer(lastOpts, true);
              return;
            }
            if (c === 101 || c === 150) {
              showMsg('Автор этого видео запретил смотреть его в других приложениях (код ' + c + ').' +
                (!playlistMode && curIndex + 1 < curVideos.length ? ' Включаю следующее…' : ''));
              if (!playlistMode && curIndex + 1 < curVideos.length) setTimeout(() => playVideo(curIndex + 1), 2500);
            } else if (c === 100) {
              showMsg('Это видео удалено или скрыто.');
            } else if (c === 153) {
              showMsg('YouTube не пустил плеер (ошибка 153). Обновите Android System WebView в Play Маркете.');
            } else {
              showMsg('Не получилось включить видео (ошибка ' + c + ').');
            }
          }

          window.pauseVideo = () => { try { yt && yt.pauseVideo(); } catch (e) {} };

          function closePlayer() {
            if (yt) { try { yt.destroy(); } catch (e) {} yt = null; }
            showMsg('');
            go(curSource && curSource.type !== 'video' ? 'source' : 'home');
          }

          /* ---------- Проверка взрослого ---------- */
          let gateAnswer = 0;
          function openGate() {
            const a = 6 + Math.floor(Math.random() * 7), b = 6 + Math.floor(Math.random() * 7);
            gateAnswer = a * b;
            $('gate-q').textContent = a + ' × ' + b + ' = ?';
            $('gate-a').value = ''; $('gate-err').textContent = '';
            go('gate');
          }
          function checkGate() {
            if (parseInt($('gate-a').value, 10) === gateAnswer) go('settings');
            else { $('gate-err').textContent = 'Неверно'; setTimeout(openGate, 900); }
          }
          $('gate-a').addEventListener('keydown', e => { if (e.key === 'Enter') checkGate(); });

          /* ---------- Настройки ---------- */
          function renderSettings() {
            const l = $('src-list');
            l.innerHTML = sources.length ? sources.map((s, i) =>
              `<div class="src">
                 <img src="${esc(s.thumb)}" alt="" onerror="this.style.visibility='hidden'">
                 <div class="n">${esc(s.title)}<small>${kindName[s.type]}</small></div>
                 <button onclick="removeSource(${i})" aria-label="Убрать">✕</button>
               </div>`).join('') : '<p style="margin:0">Список пуст.</p>';
          }

          function removeSource(i) {
            if (!confirm('Убрать «' + sources[i].title + '»?')) return;
            try { localStorage.removeItem('kt_cache_' + sources[i].ytId); } catch (e) {}
            sources.splice(i, 1); saveSources(); renderSettings();
          }

          function parseInput(raw) {
            let s = raw.trim();
            if (!s) return null;
            if (/^@[\w.\-]+$/.test(s)) return { kind: 'handle', url: 'https://www.youtube.com/' + s };
            if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
            let u; try { u = new URL(s); } catch (e) { return null; }
            if (!/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(u.hostname)) return null;
            const list = u.searchParams.get('list');
            const v = u.searchParams.get('v');
            if (u.hostname.endsWith('youtu.be')) return { kind: 'video', id: u.pathname.slice(1).split('/')[0] };
            let m;
            if ((m = u.pathname.match(/^\/(shorts|live|embed)\/([\w-]{11})/))) return { kind: 'video', id: m[2] };
            if (list && !v) return { kind: 'playlist', id: list };
            if (v) return { kind: 'video', id: v };
            if ((m = u.pathname.match(/^\/channel\/(UC[\w-]{22})/))) return { kind: 'channel', id: m[1] };
            return { kind: 'handle', url: 'https://www.youtube.com' + u.pathname.split('/').slice(0, 3).join('/') };
          }

          async function addSource() {
            const note = $('add-note');
            const p = parseInput($('add-url').value);
            note.className = 'note';
            if (!p) { note.className = 'note err'; note.textContent = 'Это не похоже на ссылку YouTube'; return; }
            note.textContent = 'Проверяю…';
            try {
              let src;
              if (p.kind === 'video') {
                const j = JSON.parse(await ytFetch('https://www.youtube.com/oembed?format=json&url=' +
                  encodeURIComponent('https://www.youtube.com/watch?v=' + p.id)));
                src = { type: 'video', ytId: p.id, title: j.title, thumb: thumbOf(p.id) };
              } else {
                let type = p.kind, id = p.id;
                if (p.kind === 'handle') {
                  const html = await ytFetch(p.url);
                  const m = html.match(/"externalId":"(UC[\w-]{22})"/) ||
                            html.match(/<link rel="canonical" href="https:\/\/www\.youtube\.com\/channel\/(UC[\w-]{22})"/) ||
                            html.match(/"channelId":"(UC[\w-]{22})"/);
                  if (!m) throw new Error('Не нашёл такой канал');
                  type = 'channel'; id = m[1];
                }
                const draft = { type, ytId: id };
                const feed = parseFeed(await ytFetch(feedUrl(draft)));
                store.set('kt_cache_' + id, { ts: Date.now(), videos: feed.videos });
                src = Object.assign(draft, {
                  title: feed.title || kindName[type],
                  thumb: feed.videos[0] ? feed.videos[0].thumb : ''
                });
              }
              if (sources.some(x => x.ytId === src.ytId)) { note.textContent = 'Уже есть в списке'; return; }
              sources.push(src); saveSources();
              $('add-url').value = '';
              note.textContent = 'Добавлено: ' + src.title;
              renderSettings();
            } catch (e) {
              note.className = 'note err';
              note.textContent = 'Не получилось добавить: ' + (e.message || e) +
                '. Если это микс YouTube (ссылка с list=RD…), такие не поддерживаются.';
            }
          }
          $('add-url').addEventListener('keydown', e => { if (e.key === 'Enter') addSource(); });

          renderHome();
          </script>
          </body>
          </html>
          KT_EOF
          echo '' | base64 -d > app/kidstube.jks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk KidsTube.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" KidsTube.apk \
            --repo "${{ github.repository }}" \
            --title "Детский YouTube, сборка ${{ github.run_number }}" \
            --notes "Скачайте KidsTube.apk и установите на телефон."
