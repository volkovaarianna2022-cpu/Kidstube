
# Детский YouTube — сборка APK одним файлом.
# Положите этот файл в репозиторий GitHub по пути .github/workflows/build.yml
name: Build KidsTube APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/kg/kidstube app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > settings.gradle <<'KT_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KidsTube"
          include ':app'
          KT_EOF
          cat > build.gradle <<'KT_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          KT_EOF
          cat > gradle.properties <<'KT_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          KT_EOF
          cat > app/build.gradle <<'KT_EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'kg.kidstube'
              compileSdk 35

              defaultConfig {
                  applicationId 'kg.kidstube'
                  minSdk 26
                  targetSdk 35
                  versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
                  versionName = '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }

              signingConfigs {
                  family {
                      storeFile file('kidstube.jks')
                      storePassword 'kidstube123'
                      keyAlias 'kidstube'
                      keyPassword 'kidstube123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.family
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          KT_EOF
          cat > app/src/main/AndroidManifest.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KT_EOF
          cat > app/src/main/res/values/strings.xml <<'KT_EOF'
          <resources><string name="app_name">Детский YouTube</string></resources>
          KT_EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          KT_EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFB238" />
          </shape>
          KT_EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M34,38 Q34,32 40,32 L68,32 Q74,32 74,38 L74,70 Q74,76 68,76 L40,76 Q34,76 34,70 Z" />
              <path android:fillColor="#E8572A" android:pathData="M48,44 L64,54 L48,64 Z" />
          </vector>
          KT_EOF
          cat > app/src/main/java/kg/kidstube/MainActivity.java <<'KT_EOF'
          package kg.kidstube;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final String BASE_URL = "https://kidstube.app/";

              private WebView web; // интерфейс приложения (каналы, настройки)
              private WebView playerWeb; // страница YouTube с видео
              private FrameLayout root;
              private FrameLayout playerLayer;
              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;
              private final Handler ui = new Handler(Looper.getMainLooper());

              private final List<String> ids = new ArrayList<>();
              private int idx = 0;
              private int reverts = 0;
              private TextView statusView;
              private String playerJs = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#FFF6E8"));
                  setContentView(root);

                  // ---------- Интерфейс ----------
                  web = new WebView(this);
                  root.addView(web, matchParent());
                  setupSettings(web);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          return true; // интерфейс никуда не переходит
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient());

                  // ---------- Плеер ----------
                  playerLayer = new FrameLayout(this);
                  playerLayer.setBackgroundColor(Color.BLACK);
                  playerLayer.setVisibility(View.GONE);
                  root.addView(playerLayer, matchParent());

                  playerWeb = new WebView(this);
                  playerWeb.setBackgroundColor(Color.BLACK);
                  playerLayer.addView(playerWeb, matchParent());
                  setupSettings(playerWeb);
                  playerWeb.addJavascriptInterface(new PlayerBridge(), "KT");
                  playerWeb.setWebViewClient(new PlayerClient());
                  playerWeb.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          if (progress >= 40) inject();
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) { callback.onCustomViewHidden(); return; }
                          customView = view;
                          customCallback = callback;
                          root.addView(view, matchParent());
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          exitFullscreen();
                      }
                  });

                  TextView close = roundButton("✕");
                  close.setOnClickListener(v -> closePlayer());
                  FrameLayout.LayoutParams lpClose = new FrameLayout.LayoutParams(dp(46), dp(46), Gravity.TOP | Gravity.START);
                  lpClose.setMargins(dp(12), dp(12), 0, 0);
                  playerLayer.addView(close, lpClose);

                  TextView next = roundButton("⏭");
                  next.setOnClickListener(v -> next());
                  FrameLayout.LayoutParams lpNext = new FrameLayout.LayoutParams(dp(46), dp(46), Gravity.TOP | Gravity.END);
                  lpNext.setMargins(0, dp(12), dp(12), 0);
                  playerLayer.addView(next, lpNext);

                  // Заранее отвечаем на вопрос YouTube про cookie, чтобы страница согласия не появлялась
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  for (String c : new String[]{
                          "SOCS=CAI; Domain=.youtube.com; Path=/; Max-Age=63072000; Secure",
                          "CONSENT=YES+cb; Domain=.youtube.com; Path=/; Max-Age=63072000; Secure"}) {
                      cm.setCookie("https://www.youtube.com", c);
                  }
                  cm.flush();

                  // Строка для сообщений об ошибках внизу плеера
                  statusView = new TextView(this);
                  statusView.setTextColor(Color.argb(220, 255, 255, 120));
                  statusView.setBackgroundColor(Color.argb(170, 0, 0, 0));
                  statusView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  statusView.setPadding(dp(8), dp(4), dp(8), dp(4));
                  statusView.setVisibility(View.GONE);
                  playerLayer.addView(statusView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM));

                  playerJs = readAsset("player.js");
                  web.loadDataWithBaseURL(BASE_URL, readAsset("index.html"), "text/html", "utf-8", null);
              }

              // ---------- Плеер: управление ----------

              private void startPlayback(String json, int index) {
                  try {
                      JSONArray arr = new JSONArray(json);
                      ids.clear();
                      for (int i = 0; i < arr.length(); i++) ids.add(arr.getJSONObject(i).getString("id"));
                  } catch (Exception e) {
                      return;
                  }
                  if (ids.isEmpty()) return;
                  idx = Math.max(0, Math.min(index, ids.size() - 1));
                  reverts = 0;
                  playerLayer.setVisibility(View.VISIBLE);
                  playerLayer.bringToFront();
                  hideSystemBars(true);
                  loadCurrent();
              }

              private void loadCurrent() {
                  if (ids.isEmpty()) return;
                  if (statusView != null) statusView.setVisibility(View.GONE);
                  playerWeb.loadUrl("https://m.youtube.com/watch?v=" + ids.get(idx));
              }

              private void next() {
                  if (playerLayer.getVisibility() != View.VISIBLE) return;
                  reverts = 0;
                  if (idx + 1 < ids.size()) {
                      idx++;
                      loadCurrent();
                  } else {
                      closePlayer();
                  }
              }

              private void closePlayer() {
                  exitFullscreen();
                  playerWeb.loadUrl("about:blank");
                  playerLayer.setVisibility(View.GONE);
                  ids.clear();
                  hideSystemBars(false);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
              }

              private void inject() {
                  if (!playerJs.isEmpty()) playerWeb.evaluateJavascript(playerJs, null);
              }

              private void exitFullscreen() {
                  if (customView == null) return;
                  root.removeView(customView);
                  customView = null;
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  if (customCallback != null) customCallback.onCustomViewHidden();
                  customCallback = null;
              }

              private static String videoIdOf(Uri u) {
                  String path = u.getPath();
                  if (path == null) return null;
                  if (path.equals("/watch")) return u.getQueryParameter("v");
                  if (path.startsWith("/shorts/") || path.startsWith("/live/")) {
                      List<String> seg = u.getPathSegments();
                      return seg.size() > 1 ? seg.get(1) : null;
                  }
                  return null;
              }

              private static boolean isYoutube(String host) {
                  return host != null && (host.equals("youtube.com") || host.endsWith(".youtube.com"));
              }

              /** Следит, чтобы в плеере открывались только разрешённые видео. */
              private class PlayerClient extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                      Uri u = req.getUrl();
                      String scheme = u.getScheme();
                      // intent://, vnd.youtube:// и прочие попытки открыть приложение YouTube — запрещены
                      if (scheme == null || !(scheme.equals("http") || scheme.equals("https"))) return true;
                      if (!req.isForMainFrame()) return false;
                      String host = u.getHost();
                      if (host != null && (host.startsWith("consent.") )) return false;
                      if (!isYoutube(host)) return true;
                      String path = u.getPath() == null ? "" : u.getPath();
                      if (path.startsWith("/sorry")) return false;
                      String id = videoIdOf(u);
                      if (id == null) return true;
                      if (ids.contains(id)) { idx = ids.indexOf(id); return false; }
                      ui.post(MainActivity.this::next); // чужое видео (автовоспроизведение) — включаем следующее своё
                      return true;
                  }

                  @Override
                  public void doUpdateVisitedHistory(WebView view, String url, boolean isReload) {
                      // YouTube меняет страницы без перезагрузки, поэтому проверяем каждый новый адрес
                      Uri u = Uri.parse(url);
                      String host = u.getHost();
                      if (!isYoutube(host) || host.startsWith("consent.")) return;
                      String path = u.getPath() == null ? "" : u.getPath();
                      if (path.startsWith("/sorry")) return;
                      String id = videoIdOf(u);
                      if (id == null) {
                          // ушли с видео (на главную, в поиск) — возвращаем; если не выходит, переходим к следующему
                          if (++reverts > 3) ui.post(MainActivity.this::next);
                          else ui.post(MainActivity.this::loadCurrent);
                      } else if (ids.contains(id)) {
                          idx = ids.indexOf(id);
                          inject();
                      } else if (!ids.isEmpty()) {
                          ui.post(MainActivity.this::next);
                      }
                  }

                  @Override
                  public void onPageFinished(WebView view, String url) {
                      inject();
                  }

                  @Override
                  public void onReceivedError(WebView view, WebResourceRequest req, android.webkit.WebResourceError err) {
                      if (req.isForMainFrame() && statusView != null) {
                          statusView.setText("Не получилось загрузить видео. Проверьте интернет. (" + err.getDescription() + ")");
                          statusView.setVisibility(View.VISIBLE);
                      }
                  }
              }

              // ---------- Системное ----------

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (customView != null) { exitFullscreen(); return; }
                  if (playerLayer.getVisibility() == View.VISIBLE) { closePlayer(); return; }
                  web.evaluateJavascript("window.handleBack ? handleBack() : false", value -> {
                      if (!"true".equals(value)) MainActivity.super.onBackPressed();
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (playerLayer.getVisibility() == View.VISIBLE) {
                      playerWeb.evaluateJavascript(
                              "(function(){var v=document.querySelector('video');if(v)v.pause();})()", null);
                  }
              }

              @Override
              protected void onDestroy() {
                  if (playerWeb != null) playerWeb.destroy();
                  if (web != null) web.destroy();
                  super.onDestroy();
              }

              @SuppressWarnings("deprecation")
              private void hideSystemBars(boolean hide) {
                  getWindow().getDecorView().setSystemUiVisibility(hide
                          ? View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                            | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          : View.SYSTEM_UI_FLAG_VISIBLE);
              }

              private void setupSettings(WebView w) {
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
         
